<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="robots" content="noindex, nofollow"/>
<title>Delicatta</title>

<!-- Configurações de Ícone -->
<link rel="apple-touch-icon" sizes="180x180" href="icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icon.png">
<link rel="shortcut icon" href="icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Delicatta">

<!-- Scripts do Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<style>
  :root{
    --ink:#3a2432; --rose-deep:#a8285e; --rose:#c2185b; --rose-soft:#f6c9dc;
    --blush:#fdf1f6; --card:#ffffff; --gold:#c99a4a; --ok:#4c9a72;
    --warn:#d9635a; --muted:#9a7f8c; --line:#f0d9e5;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:#efd9e3;min-height:100vh;}
  body{font-family:'Segoe UI',Helvetica,Arial,sans-serif;color:var(--ink);display:flex;justify-content:center;}
  #app{
    font-family:inherit;background:linear-gradient(180deg,var(--blush) 0%, #fff 60%);
    color:var(--ink);width:100%;max-width:1200px;min-height:100vh;display:flex;
    flex-direction:column;position:relative;box-shadow:0 0 40px rgba(162,40,90,.12);
  }
  .header{
    padding:22px 24px 16px;background:linear-gradient(135deg,var(--rose-deep),var(--rose) 70%);
    color:#fff;border-radius:0 0 26px 26px;box-shadow:0 6px 18px rgba(162,40,90,.25);
  }
  .brand-row{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;}
  .brand{font-family:Georgia,serif;font-size:30px;font-weight:700;display:flex;align-items:baseline;gap:8px;}
  .brand .dot{color:var(--gold);}
  .tagline{font-size:12.5px;opacity:.88;margin-top:2px;font-style:italic;}
  .kpirow{display:flex;gap:10px;margin-top:16px;overflow-x:auto;padding-bottom:2px;}
  .kpi{
    background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.25);
    border-radius:14px;padding:10px 12px;min-width:100px;flex:1;
  }
  .kpi .l{font-size:9.5px;text-transform:uppercase;opacity:.85;}
  .kpi .v{font-size:14px;font-weight:700;margin-top:3px;}
  .content{flex:1;padding:20px;overflow-y:auto;}
  .grid-2col{display:grid;grid-template-columns:1fr;gap:20px;}
  @media(min-width:768px){.grid-2col{grid-template-columns:1fr 1fr;}}
  .section-title{
    font-family:Georgia,serif;font-size:18px;font-weight:700;color:var(--rose-deep);
    margin:6px 0 12px;display:flex;align-items:center;justify-content:space-between;
  }
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:16px;
    padding:14px 16px;margin-bottom:10px;box-shadow:0 2px 8px rgba(162,40,90,.05);
  }
  .row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;}
  .prod-name{font-weight:700;font-size:15px;}
  .prod-sub{font-size:13px;color:var(--muted);margin-top:2px;white-space:normal;}
  .pill{
    font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;
    background:var(--rose-soft);color:var(--rose-deep);white-space:nowrap;
  }
  .pill.ok{background:#dcf1e6;color:var(--ok);}
  .pill.warn{background:#fbdedb;color:var(--warn);}
  .icon-btn{
    border:none;background:var(--blush);color:var(--rose-deep);
    width:30px;height:30px;border-radius:50%;font-size:15px;line-height:1;
    display:flex;align-items:center;justify-content:center;cursor:pointer;
  }
  .icon-btn.del{color:var(--warn);background:#fdeceb;}
  .form-card{
    background:var(--card);border:1.5px dashed var(--rose-soft);border-radius:16px;
    padding:16px;margin-bottom:16px;
  }
  .field{margin-bottom:10px;}
  .field label{font-size:11.5px;color:var(--muted);display:block;margin-bottom:4px;}
  .field input,.field select{
    width:100%;padding:9px 11px;border-radius:10px;border:1.5px solid var(--line);
    font-size:14px;background:#fff;color:var(--ink);font-family:inherit;
  }
  .two-col{display:flex;gap:10px;}
  .two-col .field{flex:1;}
  .btn{
    width:100%;padding:11px;border:none;border-radius:12px;background:var(--rose);
    color:#fff;font-weight:700;font-size:14px;cursor:pointer;margin-top:4px;
  }
  .btn.secondary{
    background:var(--blush);color:var(--rose-deep);border:1px solid var(--rose-soft);
    padding:8px 12px;font-size:12.5px;margin-bottom:10px;
  }
  .btn.pay{background:var(--ok);color:#fff;width:auto;padding:6px 12px;font-size:12px;}
  .btn.danger{background:#d9635a;color:#fff;}
  .stock-input{
    width:80px;padding:6px 8px;border-radius:8px;border:1.5px solid var(--line);
    text-align:center;font-size:14px;
  }
  .bar-row{margin-bottom:12px;}
  .bar-label{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:5px;}
  .bar-track{background:var(--rose-soft);border-radius:8px;height:9px;overflow:hidden;}
  .bar-fill{background:linear-gradient(90deg,var(--rose-deep),var(--rose));height:100%;border-radius:8px;}
  .empty{text-align:center;color:var(--muted);font-size:13px;padding:30px 10px;}
  .tabbar{
    position:sticky;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);
    display:flex;padding:8px 4px 12px;box-shadow:0 -4px 14px rgba(162,40,90,.08);
  }
  .tab{
    flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
    background:none;border:none;color:var(--muted);font-size:10px;font-weight:600;
    padding:6px 1px;cursor:pointer;border-radius:10px;font-family:inherit;
  }
  .tab.active{color:var(--rose-deep);background:var(--blush);}
  .tab .ic{font-size:17px;}
  .sync-badge{font-size:11px;background:rgba(255,255,255,.2);padding:4px 10px;border-radius:20px;}
  .item-row{display:flex;gap:8px;align-items:center;margin-bottom:8px;}
  .item-row select{flex:2;}
  .item-row input{flex:1;}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
  const firebaseConfig = {
    apiKey: "AIzaSyDTw6wSZAONSN3LpPAiRVW4qvU8iR8AroU",
    authDomain: "delicatta-management.firebaseapp.com",
    projectId: "delicatta-management",
    storageBucket: "delicatta-management.firebasestorage.app",
    messagingSenderId: "565090618945",
    appId: "1:565090618945:web:0497ca3e5bae46487cc0c0",
    measurementId: "G-Q6Z1ZTH6E2"
  };

  let db = null;
  let useFirebase = false;

  try {
    firebase.initializeApp(firebaseConfig);
    db = firebase.firestore();
    useFirebase = true;
  } catch(e) { console.log("Erro ao iniciar Firebase", e); }

  const $ = (sel, el=document) => el.querySelector(sel);
  const $$ = sel => Array.from(document.querySelectorAll(sel));
  const app = $('#app');

  const uid = () => Math.random().toString(36).slice(2,9);
  const fmt = n => (Math.round(n||0)).toLocaleString('pt-PT') + ' Kz';
  const pct = n => (((n||0)*100).toFixed(1)) + '%';
  const today = () => new Date().toISOString().slice(0,10);
  const dfmt = iso => { if(!iso) return ''; const [y,m,d]=iso.split('-'); return `${d}/${m}/${y}`; };

  const DEFAULT_PRODUCTS = [
    {nome:'Body Splash', custo:16000, venda:24000},
    {nome:'Perfume', custo:37000, venda:47000},
    {nome:'Body Cream', custo:17000, venda:25000},
    {nome:'Óleo Corporal', custo:16000, venda:24000},
    {nome:'Lingerie', custo:5000, venda:10000},
    {nome:'Perfume de Calcinha', custo:3000, venda:6000},
  ].map(p => ({...p, id: uid()}));

  let state = { produtos: [], vendas: [], dividas: [], estoque: {}, tab: 'resumo' };
  let formDividaItens = [{ id: uid(), produtoId: '', qtd: 1 }];

  function init(){
    if(useFirebase){
      db.collection('delicatta').doc('dados').onSnapshot(doc => {
        if(doc.exists){
          const data = doc.data();
          state.produtos = data.produtos || DEFAULT_PRODUCTS;
          state.vendas = data.vendas || [];
          state.dividas = data.dividas || [];
          state.estoque = data.estoque || {};
        } else {
          state.produtos = DEFAULT_PRODUCTS;
          state.produtos.forEach(p => state.estoque[p.id] = 10);
          saveData();
        }
        render();
      });
    } else {
      loadLocal();
    }
  }

  function loadLocal(){
    try{ state.produtos = JSON.parse(localStorage.getItem('delicatta:produtos')) || DEFAULT_PRODUCTS; }catch(e){ state.produtos = DEFAULT_PRODUCTS; }
    try{ state.vendas = JSON.parse(localStorage.getItem('delicatta:vendas')) || []; }catch(e){ state.vendas = []; }
    try{ state.dividas = JSON.parse(localStorage.getItem('delicatta:dividas')) || []; }catch(e){ state.dividas = []; }
    try{ state.estoque = JSON.parse(localStorage.getItem('delicatta:estoque')) || {}; }catch(e){ state.estoque = {}; }
    state.produtos.forEach(p=>{ if(!(p.id in state.estoque)) state.estoque[p.id] = 10; });
    render();
  }

  function saveData(){
    if(useFirebase){
      db.collection('delicatta').doc('dados').set({
        produtos: state.produtos,
        vendas: state.vendas,
        dividas: state.dividas,
        estoque: state.estoque
      });
    } else {
      localStorage.setItem('delicatta:produtos', JSON.stringify(state.produtos));
      localStorage.setItem('delicatta:vendas', JSON.stringify(state.vendas));
      localStorage.setItem('delicatta:dividas', JSON.stringify(state.dividas));
      localStorage.setItem('delicatta:estoque', JSON.stringify(state.estoque));
      render();
    }
  }

  function vendidoDe(produtoId){
    return state.vendas.filter(v=>v.produtoId===produtoId).reduce((s,v)=>s+v.qtd,0);
  }

  function totalVendaItem(produtoId, qtd){
    const p = state.produtos.find(x=>x.id===produtoId);
    return p ? p.venda*qtd : 0;
  }

  function totalVenda(v){
    if(v.itens && Array.isArray(v.itens)){
      return v.itens.reduce((s, item) => s + totalVendaItem(item.produtoId, item.qtd), 0);
    }
    return totalVendaItem(v.produtoId, v.qtd);
  }

  function totalLucroItem(produtoId, qtd){
    const p = state.produtos.find(x=>x.id===produtoId);
    return p ? (p.venda-p.custo)*qtd : 0;
  }

  function totalLucro(v){
    if(v.itens && Array.isArray(v.itens)){
      return v.itens.reduce((s, item) => s + totalLucroItem(item.produtoId, item.qtd), 0);
    }
    return totalLucroItem(v.produtoId, v.qtd);
  }

  function kpis(){
    const faturamento = state.vendas.reduce((s,v)=>s+totalVenda(v),0);
    const lucro = state.vendas.reduce((s,v)=>s+totalLucro(v),0);
    const margem = faturamento ? lucro/faturamento : 0;
    const emDivida = state.dividas.reduce((s,d)=>s+totalVenda(d),0);
    return {faturamento, lucro, margem, emDivida};
  }

  function header(){
    const k = kpis();
    return `
    <div class="header">
      <div class="brand-row">
        <div>
          <div class="brand">Delicatta<span class="dot">.</span></div>
          <div class="tagline">Gestão do meu negócio 💗</div>
        </div>
        <div class="sync-badge">${useFirebase ? '🟢 Nuvem Ativa' : '🟡 Modo Local'}</div>
      </div>
      <div class="kpirow">
        <div class="kpi"><div class="l">Faturamento</div><div class="v">${fmt(k.faturamento)}</div></div>
        <div class="kpi"><div class="l">Lucro</div><div class="v">${fmt(k.lucro)}</div></div>
        <div class="kpi"><div class="l">Em Dívida</div><div class="v" style="color:#ffb3c6;">${fmt(k.emDivida)}</div></div>
      </div>
    </div>`;
  }

  function tabbar(){
    const tabs = [
      {id:'resumo', ic:'✨', label:'Resumo'},
      {id:'vendas', ic:'🛍️', label:'Vendas'},
      {id:'dividas', ic:'📝', label:'Dívidas'},
      {id:'estoque', ic:'📦', label:'Estoque'},
      {id:'produtos', ic:'🏷️', label:'Produtos'},
      {id:'sync', ic:'⚙️', label:'Opções'},
    ];
    return `<div class="tabbar">
      ${tabs.map(t=>`<button class="tab ${state.tab===t.id?'active':''}" data-tab="${t.id}">
        <span class="ic">${t.ic}</span>${t.label}
      </button>`).join('')}
    </div>`;
  }

  function viewResumo(){
    const k = kpis();
    const ranking = state.produtos.map(p=>{
      const qtd = vendidoDe(p.id);
      const lucro = qtd*(p.venda-p.custo);
      return {nome:p.nome, qtd, lucro};
    }).sort((a,b)=>b.lucro-a.lucro);
    const maxLucro = Math.max(1, ...ranking.map(r=>r.lucro));

    return `
    <div class="grid-2col">
      <div>
        <div class="section-title">Resumo Financeiro</div>
        <div class="card row">
          <div>
            <div class="prod-name">${fmt(k.emDivida)}</div>
            <div class="prod-sub">Total a receber das clientes</div>
          </div>
          <div class="pill warn">A RECEBER</div>
        </div>
      </div>
      <div>
        <div class="section-title">Lucro por produto</div>
        ${ranking.every(r=>r.lucro===0) ? `<div class="empty">Ainda sem vendas registadas.<br>Vai à aba Vendas 🛍️</div>` :
          ranking.map(r=>`
          <div class="bar-row">
            <div class="bar-label"><span>${r.nome}</span><span>${fmt(r.lucro)}</span></div>
            <div class="bar-track"><div class="bar-fill" style="width:${Math.max(4,(r.lucro/maxLucro)*100)}%"></div></div>
          </div>`).join('')}
      </div>
    </div>`;
  }

  function viewDividas(){
    const options = state.produtos.map(p=>`<option value="${p.id}">${p.nome}</option>`).join('');

    const renderItensInputs = formDividaItens.map((item, idx) => `
      <div class="item-row" data-item-id="${item.id}">
        <select class="nd-item-prod" data-idx="${idx}">
          <option value="">Selecione o produto...</option>
          ${state.produtos.map(p => `<option value="${p.id}" ${item.produtoId===p.id?'selected':''}>${p.nome} (${fmt(p.venda)})</option>`).join('')}
        </select>
        <input class="nd-item-qtd" type="number" min="1" value="${item.qtd}" placeholder="Qtd" data-idx="${idx}"/>
        ${formDividaItens.length > 1 ? `<button class="icon-btn del remove-item-btn" data-idx="${idx}">✕</button>` : ''}
      </div>
    `).join('');

    const list = [...state.dividas].sort((a,b)=> b.data.localeCompare(a.data)).map(d=>{
      let itensHtml = '';
      if(d.itens && Array.isArray(d.itens) && d.itens.length > 0){
        itensHtml = d.itens.map(it => {
          const p = state.produtos.find(x=>x.id===it.produtoId);
          return p ? `<div>• ${p.nome} × ${it.qtd} <span style="opacity:0.7">(${fmt(p.venda * it.qtd)})</span></div>` : '';
        }).join('');
      } else {
        const p = state.produtos.find(x=>x.id===d.produtoId);
        if(p) itensHtml = `<div>• ${p.nome} × ${d.qtd} <span style="opacity:0.7">(${fmt(p.venda * d.qtd)})</span></div>`;
      }

      return `
      <div class="card">
        <div class="row">
          <div>
            <div class="prod-name">👤 ${d.cliente}</div>
            <div class="prod-sub" style="margin-top:6px;line-height:1.4;color:var(--ink);">${itensHtml}</div>
            <div class="prod-sub" style="margin-top:4px;font-size:11.5px;color:var(--muted);">Data: ${dfmt(d.data)}</div>
          </div>
          <div class="pill warn">${fmt(totalVenda(d))}</div>
        </div>
        <div class="row" style="margin-top:10px;padding-top:8px;border-top:1px dashed var(--line);">
          <button class="btn pay" data-pay-divida="${d.id}">Pagar 💳</button>
          <button class="icon-btn del" data-del-divida="${d.id}">✕</button>
        </div>
      </div>`;
    }).join('');

    return `
    <div class="grid-2col">
      <div>
        <div class="section-title">Registar Dívida</div>
        <div class="form-card">
          <div class="field"><label>Nome da Cliente</label><input id="nd-cliente" placeholder="Ex: Maria"/></div>
          <div class="field"><label>Data</label><input id="nd-data" type="date" value="${today()}"/></div>
          
          <div class="field" style="margin-top:12px;">
            <label>Produtos em Dívida</label>
            <div id="divida-itens-container">${renderItensInputs}</div>
            <button class="btn secondary" id="add-item-btn" style="margin-top:4px;">+ Adicionar Outro Produto</button>
          </div>

          <button class="btn" id="add-divida">Registar Dívida</button>
        </div>
      </div>
      <div>
        <div class="section-title">Dívidas Ativas</div>
        ${list || '<div class="empty">Nenhuma dívida pendente. 🎉</div>'}
      </div>
    </div>`;
  }

  function viewProdutos(){
    const rows = state.produtos.map(p=>{
      const margem = p.venda ? (p.venda-p.custo)/p.venda : 0;
      return `
      <div class="card row">
        <div>
          <div class="prod-name">${p.nome}</div>
          <div class="prod-sub">Custo Un: <b>${fmt(p.custo)}</b><br>Venda Un: <b>${fmt(p.venda)}</b></div>
        </div>
        <div class="row" style="gap:8px;">
          <span class="pill">${pct(margem)}</span>
          <button class="icon-btn del" data-del-prod="${p.id}">✕</button>
        </div>
      </div>`;
    }).join('');

    return `
    <div class="grid-2col">
      <div>
        <div class="section-title">Novo produto</div>
        <div class="form-card">
          <div class="field"><label>Nome</label><input id="np-nome" placeholder="Ex: Sabonete Íntimo"/></div>
          <div class="two-col">
            <div class="field"><label>Custo Un (Kz)</label><input id="np-custo" type="number" placeholder="24000"/></div>
            <div class="field"><label>Venda Un (Kz)</label><input id="np-venda" type="number" placeholder="30000"/></div>
          </div>
          <button class="btn" id="add-produto">Adicionar produto</button>
        </div>
      </div>
      <div>
        <div class="section-title">O que vendo</div>
        ${rows || '<div class="empty">Nenhum produto ainda.</div>'}
      </div>
    </div>`;
  }

  function viewVendas(){
    const options = state.produtos.map(p=>`<option value="${p.id}">${p.nome}</option>`).join('');
    const list = [...state.vendas].sort((a,b)=> b.data.localeCompare(a.data)).map(v=>{
      let itensSummary = '';
      if(v.itens && Array.isArray(v.itens) && v.itens.length > 0){
        itensSummary = v.itens.map(it => {
          const p = state.produtos.find(x=>x.id===it.produtoId);
          return p ? `${p.nome} × ${it.qtd}` : '';
        }).filter(Boolean).join(', ');
      } else {
        const p = state.produtos.find(x=>x.id===v.produtoId);
        if(p) itensSummary = `${p.nome} × ${v.qtd}`;
      }

      return `
      <div class="card row">
        <div>
          <div class="prod-name">${itensSummary}</div>
          <div class="prod-sub">${dfmt(v.data)} · Lucro ${fmt(totalLucro(v))}</div>
        </div>
        <div class="row" style="gap:8px;">
          <span class="pill">${fmt(totalVenda(v))}</span>
          <button class="icon-btn del" data-del-venda="${v.id}">✕</button>
        </div>
      </div>`;
    }).join('');

    return `
    <div class="grid-2col">
      <div>
        <div class="section-title">Registar venda</div>
        <div class="form-card">
          <div class="field"><label>Produto</label><select id="nv-produto">${options}</select></div>
          <div class="two-col">
            <div class="field"><label>Quantidade</label><input id="nv-qtd" type="number" min="1" value="1"/></div>
            <div class="field"><label>Data</label><input id="nv-data" type="date" value="${today()}"/></div>
          </div>
          <button class="btn" id="add-venda">Registar venda</button>
        </div>
      </div>
      <div>
        <div class="section-title">Histórico de Vendas</div>
        ${list || '<div class="empty">Ainda sem vendas registadas.</div>'}
      </div>
    </div>`;
  }

  function viewEstoque(){
    let totalCustoEstoque = 0;
    let totalVendaEstoque = 0;

    const rows = state.produtos.map(p=>{
      const disponivel = state.estoque[p.id]||0;
      const valorVendaSobra = Math.max(disponivel,0) * p.venda;
      const valorCustoSobra = Math.max(disponivel,0) * p.custo;
      
      totalCustoEstoque += valorCustoSobra;
      totalVendaEstoque += valorVendaSobra;

      const status = disponivel <= 2 ? 'warn' : 'ok';
      return `
      <div class="card">
        <div class="row">
          <div class="prod-name">${p.nome}</div>
          <span class="pill ${status}">${disponivel <= 2 ? 'COMPRAR' : 'DISPONÍVEL'}</span>
        </div>
        <div class="row" style="margin-top:10px;align-items:center;">
          <div class="prod-sub">Quantidade disponível:</div>
          <input class="stock-input" type="number" min="0" value="${disponivel}" data-stock-for="${p.id}"/>
        </div>
        <div class="row" style="margin-top:8px;background:var(--blush);padding:8px;border-radius:8px;">
          <div class="prod-sub">Valor de Venda Potencial: <b>${fmt(valorVendaSobra)}</b></div>
        </div>
      </div>`;
    }).join('');

    return `
    <div class="grid-2col">
      <div>
        <div class="section-title">Resumo do Estoque em Loja</div>
        <div class="card">
          <div class="prod-sub">Valor de Custo (Investido):</div>
          <div class="prod-name" style="font-size:18px;color:var(--rose-deep);">${fmt(totalCustoEstoque)}</div>
          <hr style="border:none;border-top:1px solid var(--line);margin:10px 0;"/>
          <div class="prod-sub">Valor de Venda Potencial:</div>
          <div class="prod-name" style="font-size:18px;color:var(--ok);">${fmt(totalVendaEstoque)}</div>
        </div>
      </div>
      <div>
        <div class="section-title">Controlo por Produto</div>
        ${rows || '<div class="empty">Nenhum produto ainda.</div>'}
      </div>
    </div>`;
  }

  function viewSync(){
    return `
    <div class="grid-2col">
      <div>
        <div class="section-title">Estado da Ligação</div>
        <div class="form-card">
          <p>🟢 O teu app está 100% conectado à nuvem do Firebase!</p>
          <p style="font-size:12px;color:var(--muted)">Tudo o que fizeres no telemóvel aparece instantaneamente no computador e vice-versa.</p>
        </div>
      </div>
      <div>
        <div class="section-title">Restaurar Padrões</div>
        <div class="form-card">
          <button class="btn danger" id="btn-reset">Restaurar Valores de Fábrica</button>
        </div>
      </div>
    </div>`;
  }

  function render(){
    let body = '';
    if(state.tab==='resumo') body = viewResumo();
    else if(state.tab==='produtos') body = viewProdutos();
    else if(state.tab==='vendas') body = viewVendas();
    else if(state.tab==='dividas') body = viewDividas();
    else if(state.tab==='estoque') body = viewEstoque();
    else if(state.tab==='sync') body = viewSync();

    app.innerHTML = `${header()}<div class="content">${body}</div>${tabbar()}`;
    bindEvents();
  }

  function bindEvents(){
    $$('.tab').forEach(btn=>{
      btn.onclick = ()=>{ state.tab = btn.dataset.tab; render(); };
    });

    const addProd = $('#add-produto');
    if(addProd){
      addProd.onclick = ()=>{
        const nome = $('#np-nome').value.trim();
        const custo = parseFloat($('#np-custo').value)||0;
        const venda = parseFloat($('#np-venda').value)||0;
        if(!nome) return;
        const id = uid();
        state.produtos.push({id, nome, custo, venda});
        state.estoque[id] = 0;
        saveData();
      };
    }

    $$('[data-del-prod]').forEach(btn=>{
      btn.onclick = ()=>{
        const id = btn.dataset.delProd;
        state.produtos = state.produtos.filter(p=>p.id!==id);
        state.vendas = state.vendas.filter(v=>v.id!==id);
        state.dividas = state.dividas.filter(d=>d.id!==id);
        delete state.estoque[id];
        saveData();
      };
    });

    const addVenda = $('#add-venda');
    if(addVenda){
      addVenda.onclick = ()=>{
        const produtoId = $('#nv-produto').value;
        const qtd = parseInt($('#nv-qtd').value)||0;
        const data = $('#nv-data').value || today();
        if(!produtoId || qtd<=0) return;
        state.vendas.push({id:uid(), produtoId, qtd, data});
        if(state.estoque[produtoId] !== undefined){
          state.estoque[produtoId] = Math.max(0, state.estoque[produtoId] - qtd);
        }
        saveData();
      };
    }

    // Dynamic items for Divida form
    $$('.nd-item-prod').forEach(select=>{
      select.onchange = (e)=>{
        const idx = parseInt(e.target.dataset.idx);
        formDividaItens[idx].produtoId = e.target.value;
      };
    });

    $$('.nd-item-qtd').forEach(input=>{
      input.onchange = (e)=>{
        const idx = parseInt(e.target.dataset.idx);
        formDividaItens[idx].qtd = parseInt(e.target.value) || 1;
      };
    });

    $$('.remove-item-btn').forEach(btn=>{
      btn.onclick = (e)=>{
        e.preventDefault();
        const idx = parseInt(btn.dataset.idx);
        formDividaItens.splice(idx, 1);
        render();
      };
    });

    const addItemBtn = $('#add-item-btn');
    if(addItemBtn){
      addItemBtn.onclick = (e)=>{
        e.preventDefault();
        formDividaItens.push({ id: uid(), produtoId: '', qtd: 1 });
        render();
      };
    }

    const addDivida = $('#add-divida');
    if(addDivida){
      addDivida.onclick = ()=>{
        const cliente = $('#nd-cliente').value.trim();
        const data = $('#nd-data').value || today();
        
        // Filter valid items
        const validItens = formDividaItens.filter(it => it.produtoId && it.qtd > 0);

        if(!cliente || validItens.length === 0){
          alert('Por favor, preencha o nome da cliente e selecione pelo menos um produto com quantidade válida.');
          return;
        }

        // Create debt record with multiple items
        const newDivida = {
          id: uid(),
          cliente,
          itens: validItens.map(it => ({ produtoId: it.produtoId, qtd: it.qtd })),
          data
        };

        state.dividas.push(newDivida);

        // Abate cada produto do stock
        validItens.forEach(it => {
          if(state.estoque[it.produtoId] !== undefined){
            state.estoque[it.produtoId] = Math.max(0, state.estoque[it.produtoId] - it.qtd);
          }
        });

        // Reset form items
        formDividaItens = [{ id: uid(), produtoId: '', qtd: 1 }];

        saveData();
      };
    }

    $$('[data-pay-divida]').forEach(btn=>{
      btn.onclick = ()=>{
        const id = btn.dataset.payDivida;
        const div = state.dividas.find(d=>d.id===id);
        if(div){
          // Convert debt to sale (preserving multiple items)
          if(div.itens && Array.isArray(div.itens)){
            state.vendas.push({
              id: uid(),
              cliente: div.cliente,
              itens: div.itens,
              data: today()
            });
          } else {
            state.vendas.push({
              id: uid(),
              produtoId: div.produtoId,
              qtd: div.qtd,
              data: today()
            });
          }
          state.dividas = state.dividas.filter(d=>d.id!==id);
          saveData();
        }
      };
    });

    $$('[data-del-divida]').forEach(btn=>{
      btn.onclick = ()=>{
        state.dividas = state.dividas.filter(d=>d.id!==btn.dataset.delDivida);
        saveData();
      };
    });

    $$('[data-del-venda]').forEach(btn=>{
      btn.onclick = ()=>{
        state.vendas = state.vendas.filter(v=>v.id!==btn.dataset.delVenda);
        saveData();
      };
    });

    $$('[data-stock-for]').forEach(inp=>{
      inp.onchange = ()=>{
        state.estoque[inp.dataset.stockFor] = parseInt(inp.value)||0;
        saveData();
      };
    });

    const btnReset = $('#btn-reset');
    if(btnReset){
      btnReset.onclick = ()=>{
        if(confirm('Limpar e restaurar valores padrão?')){
          state.produtos = DEFAULT_PRODUCTS;
          state.vendas = [];
          state.dividas = [];
          state.estoque = {};
          state.produtos.forEach(p => state.estoque[p.id] = 10);
          formDividaItens = [{ id: uid(), produtoId: '', qtd: 1 }];
          saveData();
        }
      };
    }
  }

  init();
})();
</script>
</body>
</html>
