<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="robots" content="noindex, nofollow"/>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>
<title>Delicatta - Gestão do Negócio</title>

<!-- Biblioteca para gerar PDF -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<style>
  :root{
    --ink:#3a2432; --rose-deep:#a8285e; --rose:#c2185b; --rose-soft:#f6c9dc;
    --blush:#fdf1f6; --card:#ffffff; --gold:#c99a4a; --ok:#4c9a72;
    --warn:#d9635a; --muted:#9a7f8c; --line:#f0d9e5;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:#efd9e3;min-height:100vh;}
  body{font-family:'Segoe UI',Helvetica,Arial,sans-serif;color:var(--ink);display:flex;justify-content:center;}
  #app{
    font-family:inherit;background:linear-gradient(180deg,var(--blush) 0%, #fff 60%);
    color:var(--ink);width:100%;max-width:1200px;min-height:100vh;display:flex;
    flex-direction:column;position:relative;box-shadow:0 0 40px rgba(162,40,90,.12);
  }
  .header{
    padding:22px 24px 18px;background:linear-gradient(135deg,var(--rose-deep),var(--rose) 70%);
    color:#fff;border-radius:0 0 26px 26px;box-shadow:0 6px 18px rgba(162,40,90,.25);
  }
  .brand-row{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;}
  .brand{font-family:Georgia,serif;font-size:30px;font-weight:700;display:flex;align-items:baseline;gap:8px;}
  .brand .dot{color:var(--gold);}
  .tagline{font-size:12.5px;opacity:.88;margin-top:2px;font-style:italic;}
  .content{flex:1;padding:20px;overflow-y:auto;}
  .grid-2col{display:grid;grid-template-columns:1fr;gap:20px;}
  @media(min-width:768px){.grid-2col{grid-template-columns:1fr 1fr;}}
  .section-title{
    font-family:Georgia,serif;font-size:18px;font-weight:700;color:var(--rose-deep);
    margin:6px 0 12px;display:flex;align-items:center;justify-content:space-between;
  }
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:16px;
    padding:14px 16px;margin-bottom:10px;box-shadow:0 2px 8px rgba(162,40,90,.05);
  }
  .row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;}
  .prod-name{font-weight:700;font-size:15px;}
  .prod-sub{font-size:13px;color:var(--muted);margin-top:2px;white-space:normal;}
  .pill{
    font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;
    background:var(--rose-soft);color:var(--rose-deep);white-space:nowrap;
  }
  .pill.ok{background:#dcf1e6;color:var(--ok);}
  .pill.warn{background:#fbdedb;color:var(--warn);}
  .pill.info,.pill.blue{background:#e8f0fe;color:#1a73e8;}
  .pill.func{background:#fae3c5;color:#8f5200;}
  .icon-btn{
    border:none;background:var(--blush);color:var(--rose-deep);
    width:30px;height:30px;border-radius:50%;font-size:15px;line-height:1;
    display:flex;align-items:center;justify-content:center;cursor:pointer;
  }
  .icon-btn.del{color:var(--warn);background:#fdeceb;}
  .icon-btn.edit{color:#1565c0;background:#e3f2fd;}
  .form-card{
    background:var(--card);border:1.5px dashed var(--rose-soft);border-radius:16px;
    padding:16px;margin-bottom:16px;
  }
  .field{margin-bottom:10px;}
  .field label{font-size:11.5px;color:var(--muted);display:block;margin-bottom:4px;}
  .field input,.field select{
    width:100%;padding:9px 11px;border-radius:10px;border:1.5px solid var(--line);
    font-size:14px;background:#fff;color:var(--ink);font-family:inherit;
  }
  .two-col{display:flex;gap:10px;}
  .two-col .field{flex:1;}
  .btn{
    width:100%;padding:11px;border:none;border-radius:12px;background:var(--rose);
    color:#fff;font-weight:700;font-size:14px;cursor:pointer;margin-top:4px;
  }
  .btn.secondary{
    background:var(--blush);color:var(--rose-deep);border:1px solid var(--rose-soft);
    padding:8px 12px;font-size:12.5px;margin-bottom:10px;
  }
  .btn.pay{background:var(--ok);color:#fff;width:auto;padding:6px 12px;font-size:12px;}
  .btn.pdf{background:#1565c0;color:#fff;width:auto;padding:6px 12px;font-size:12px;}
  .btn.wa{background:#25d366;color:#fff;width:auto;padding:6px 12px;font-size:12px;}
  .btn.cancel{background:#8a7680;color:#fff;}
  .stock-input{
    width:80px;padding:6px 8px;border-radius:8px;border:1.5px solid var(--line);
    text-align:center;font-size:14px;
  }
  .bar-row{margin-bottom:12px;}
  .bar-label{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:5px;}
  .bar-track{background:var(--rose-soft);border-radius:8px;height:9px;overflow:hidden;}
  .bar-fill{background:linear-gradient(90deg,var(--rose-deep),var(--rose));height:100%;border-radius:8px;}
  .empty{text-align:center;color:var(--muted);font-size:13px;padding:30px 10px;}
  .tabbar{
    position:sticky;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);
    display:flex;padding:8px 4px 12px;box-shadow:0 -4px 14px rgba(162,40,90,.08);
  }
  .tab{
    flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
    background:none;border:none;color:var(--muted);font-size:10px;font-weight:600;
    padding:6px 1px;cursor:pointer;border-radius:10px;font-family:inherit;
  }
  .tab.active{color:var(--rose-deep);background:var(--blush);}
  .tab .ic{font-size:17px;}
  .sync-badge{font-size:11px;background:rgba(255,255,255,.2);padding:4px 10px;border-radius:20px;font-weight:600;}
  .sync-badge.protected{background:#00897b;color:#fff;}
  .sync-badge.connecting{background:#ff8f00;color:#fff;}
  .item-row{display:flex;gap:8px;align-items:center;margin-bottom:8px;}
  .item-row select{flex:2;}
  .item-row input{flex:1;}
</style>
</head>
<body>
<div id="app"></div>

<script>
(function(){
  const firebaseConfig = {
    apiKey: "AIzaSyDTw6wSZAONSN3LpPAiRVW4qvU8iR8AroU",
    authDomain: "delicatta-management.firebaseapp.com",
    projectId: "delicatta-management",
    storageBucket: "delicatta-management.firebasestorage.app",
    messagingSenderId: "565090618945",
    appId: "1:565090618945:web:0497ca3e5bae46487cc0c0",
    measurementId: "G-Q6Z1ZTH6E2"
  };

  let db = null;
  let syncStatus = 'connecting'; // 'connecting', 'protected', 'local'

  if (typeof firebase !== 'undefined') {
    try {
      firebase.initializeApp(firebaseConfig);
      db = firebase.firestore();
    } catch(e) { console.warn("Erro ao iniciar Firebase", e); }
  }

  const $ = (sel, el=document) => el.querySelector(sel);
  const $$ = sel => Array.from(document.querySelectorAll(sel));
  const app = $('#app');

  const uid = () => Math.random().toString(36).slice(2,9);
  const fmt = n => (Math.round(n||0)).toLocaleString('pt-PT') + ' Kz';
  const pct = n => (((n||0)*100).toFixed(1)) + '%';
  const today = () => new Date().toISOString().slice(0,10);
  const dfmt = iso => iso || '';

  const formatTitleCase = str => {
    if (!str) return 'Geral';
    return str
      .toLowerCase()
      .split(' ')
      .map(word => word.charAt(0).toUpperCase() + word.slice(1))
      .join(' ');
  };

  const DEFAULT_PRODUCTS = [
    {nome:'Body Splash', custo:16000, venda:24000, comissao:1500},
    {nome:'Perfume', custo:37000, venda:47000, comissao:1500},
    {nome:'Body Cream', custo:17000, venda:25000, comissao:1500},
    {nome:'Óleo Corporal', custo:16000, venda:24000, comissao:1500},
    {nome:'Lingerie', custo:5000, venda:10000, comissao:1000},
    {nome:'Perfume de Calcinha', custo:3000, venda:6000, comissao:500},
  ].map(p => ({...p, id: uid()}));

  let state = { 
    produtos: [], 
    vendas: [], 
    dividas: [], 
    estoque: {}, 
    tab: 'resumo',
    selectedMonth: today().slice(0,7),
    editingProductId: null
  };

  let formVendaItens = [{ id: uid(), produtoId: '', qtd: 1 }];
  let formDividaItens = [{ id: uid(), produtoId: '', qtd: 1 }];

  function init(){
    if(!db){
      syncStatus = 'local';
      loadLocalDataOnly();
      render();
      return;
    }

    // Mostra "Conectando..." enquanto liga ao Firestore
    loadLocalDataOnly();
    render();

    connectFirestoreSync();
  }

  function connectFirestoreSync(){
    db.collection('delicatta').doc('dados').onSnapshot(doc => {
      syncStatus = 'protected';
      if(doc.exists){
        const data = doc.data();
        state.produtos = (data.produtos || DEFAULT_PRODUCTS).map(p => ({
          ...p,
          comissao: p.comissao !== undefined ? p.comissao : 0
        }));
        state.vendas = data.vendas || [];
        state.dividas = data.dividas || [];
        state.estoque = data.estoque || {};
        state.produtos.forEach(p=>{ if(!(p.id in state.estoque)) state.estoque[p.id] = 10; });
        saveLocalOnly();
        render();
      } else {
        loadLocalDataOnly();
        saveData();
      }
    }, err => {
      console.error("Erro na leitura do Firebase", err);
      syncStatus = 'local';
      render();
    });
  }

  function loadLocalDataOnly(){
    try{ 
      state.produtos = (JSON.parse(localStorage.getItem('delicatta:produtos')) || DEFAULT_PRODUCTS).map(p => ({
        ...p,
        comissao: p.comissao !== undefined ? p.comissao : 0
      }));
    }catch(e){ state.produtos = DEFAULT_PRODUCTS; }
    try{ state.vendas = JSON.parse(localStorage.getItem('delicatta:vendas')) || []; }catch(e){ state.vendas = []; }
    try{ state.dividas = JSON.parse(localStorage.getItem('delicatta:dividas')) || []; }catch(e){ state.dividas = []; }
    try{ state.estoque = JSON.parse(localStorage.getItem('delicatta:estoque')) || {}; }catch(e){ state.estoque = {}; }
    state.produtos.forEach(p=>{ if(!(p.id in state.estoque)) state.estoque[p.id] = 10; });
  }

  function saveLocalOnly(){
    localStorage.setItem('delicatta:produtos', JSON.stringify(state.produtos));
    localStorage.setItem('delicatta:vendas', JSON.stringify(state.vendas));
    localStorage.setItem('delicatta:dividas', JSON.stringify(state.dividas));
    localStorage.setItem('delicatta:estoque', JSON.stringify(state.estoque));
  }

  function saveData(){
    saveLocalOnly();

    if(syncStatus === 'protected' && db){
      db.collection('delicatta').doc('dados').set({
        produtos: state.produtos,
        vendas: state.vendas,
        dividas: state.dividas,
        estoque: state.estoque
      }).catch(err => console.error("Erro ao guardar na nuvem:", err));
    }
    render();
  }

  function totalVendaItem(produtoId, qtd){
    const p = state.produtos.find(x=>x.id===produtoId);
    return p ? p.venda*qtd : 0;
  }

  function totalCustoItem(produtoId, qtd){
    const p = state.produtos.find(x=>x.id===produtoId);
    return p ? p.custo*qtd : 0;
  }

  function totalComissaoItem(produtoId, qtd){
    const p = state.produtos.find(x=>x.id===produtoId);
    return p ? (p.comissao || 0)*qtd : 0;
  }

  function totalVenda(v){
    if(v.itens && Array.isArray(v.itens)){
      return v.itens.reduce((s, item) => s + totalVendaItem(item.produtoId, item.qtd), 0);
    }
    return totalVendaItem(v.produtoId, v.qtd);
  }

  function totalCusto(v){
    if(v.itens && Array.isArray(v.itens)){
      return v.itens.reduce((s, item) => s + totalCustoItem(item.produtoId, item.qtd), 0);
    }
    return totalCustoItem(v.produtoId, v.qtd);
  }

  function totalLucroItem(produtoId, qtd){
    const p = state.produtos.find(x=>x.id===produtoId);
    return p ? (p.venda-p.custo)*qtd : 0;
  }

  function totalLucro(v){
    if(v.itens && Array.isArray(v.itens)){
      return v.itens.reduce((s, item) => s + totalLucroItem(item.produtoId, item.qtd), 0);
    }
    return totalLucroItem(v.produtoId, v.qtd);
  }

  function totalComissao(v){
    if(v.itens && Array.isArray(v.itens)){
      return v.itens.reduce((s, item) => s + totalComissaoItem(item.produtoId, item.qtd), 0);
    }
    return totalComissaoItem(v.produtoId, v.qtd);
  }

  function exportBackup() {
    const backupData = {
      produtos: state.produtos,
      vendas: state.vendas,
      dividas: state.dividas,
      estoque: state.estoque,
      exportDate: new Date().toISOString()
    };
    const blob = new Blob([JSON.stringify(backupData, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `Backup_Delicatta_${today()}.json`;
    a.click();
    URL.revokeObjectURL(url);
  }

  function importBackup(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(evt) {
      try {
        const data = JSON.parse(evt.target.result);
        if (data.produtos && data.vendas && data.dividas && data.estoque) {
          state.produtos = data.produtos;
          state.vendas = data.vendas;
          state.dividas = data.dividas;
          state.estoque = data.estoque;
          saveData();
          alert('Backup restaurado com sucesso!');
        } else {
          alert('Ficheiro de backup inválido.');
        }
      } catch (err) {
        alert('Erro ao ler o ficheiro de backup.');
      }
    };
    reader.readAsText(file);
  }

  function gerarPDF(item, tipo) {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    const isDivida = tipo === 'divida';

    doc.setFont('times', 'bold');
    doc.setFontSize(22);
    doc.setTextColor(168, 40, 94);
    doc.text('DELICATTA', 105, 20, { align: 'center' });

    doc.setFont('helvetica', 'normal');
    doc.setFontSize(8);
    doc.setTextColor(140, 110, 125);
    doc.text('PERFUMARIA & LINGERIE', 105, 25, { align: 'center' });

    doc.setFont('helvetica', 'bold');
    doc.setFontSize(8);
    doc.setTextColor(168, 40, 94);
    doc.text('CLIENTE:', 20, 42);
    doc.text('DATA:', 190, 42, { align: 'right' });

    doc.setFontSize(10);
    doc.setTextColor(30, 30, 30);
    doc.text(formatTitleCase(item.cliente), 20, 48);
    doc.text(dfmt(item.data), 190, 48, { align: 'right' });

    doc.setFont('helvetica', 'bold');
    doc.setFontSize(11);
    doc.setTextColor(168, 40, 94);
    doc.text(isDivida ? 'EXTRATO DE CONTA' : 'FATURA DE VENDA', 20, 60);

    let y = 75;
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(8);
    doc.setTextColor(168, 40, 94);

    doc.text('ITEM / DESCRIÇÃO', 20, y);
    doc.text('QTD', 95, y, { align: 'center' });
    doc.text('PREÇO UNIT.', 140, y, { align: 'right' });
    doc.text('TOTAL', 190, y, { align: 'right' });

    doc.setDrawColor(168, 40, 94);
    doc.setLineWidth(0.8);
    doc.line(20, y + 3, 190, y + 3);

    y += 12;
    doc.setFont('helvetica', 'normal');
    doc.setFontSize(9);
    doc.setTextColor(50, 50, 50);

    let totalGeral = 0;

    const printLinha = (pNome, qtd, pVenda) => {
      const subtotal = pVenda * qtd;
      totalGeral += subtotal;
      doc.text(pNome, 20, y);
      doc.text(`${qtd}`, 95, y, { align: 'center' });
      doc.text(fmt(pVenda), 140, y, { align: 'right' });
      doc.setFont('helvetica', 'bold');
      doc.text(fmt(subtotal), 190, y, { align: 'right' });
      doc.setFont('helvetica', 'normal');

      doc.setDrawColor(240, 217, 229);
      doc.setLineWidth(0.3);
      doc.line(20, y + 4, 190, y + 4);

      y += 10;
    };

    if (item.itens && item.itens.length > 0) {
      item.itens.forEach(it => {
        const p = state.produtos.find(x => x.id === it.produtoId);
        if (p) printLinha(p.nome, it.qtd, p.venda);
      });
    } else {
      const p = state.produtos.find(x => x.id === item.produtoId);
      if (p) printLinha(p.nome, item.qtd, p.venda);
    }

    y += 5;
    const boxWidth = 85;
    const boxHeight = 26;
    const boxX = 105;

    doc.setFillColor(246, 201, 220);
    doc.roundedRect(boxX, y, boxWidth, boxHeight, 3, 3, 'F');

    doc.setFont('helvetica', 'bold');
    doc.setFontSize(8);
    doc.setTextColor(168, 40, 94);
    doc.text(isDivida ? 'Valor Total Pendente:' : 'Valor Total Pago:', boxX + boxWidth - 8, y + 9, { align: 'right' });

    doc.setFontSize(14);
    doc.text(fmt(totalGeral), boxX + boxWidth - 8, y + 20, { align: 'right' });

    doc.setDrawColor(240, 217, 229);
    doc.setLineWidth(0.4);
    doc.line(20, y + 45, 190, y + 45);

    doc.setFont('helvetica', 'italic');
    doc.setFontSize(8);
    doc.setTextColor(154, 127, 139);
    doc.text('Obrigado pela sua preferência! Delicatta', 105, y + 53, { align: 'center' });

    const nomeFicheiro = item.cliente ? formatTitleCase(item.cliente).replace(/\s+/g, '_') : 'Cliente';
    doc.save(`Fatura_Delicatta_${nomeFicheiro}.pdf`);
  }

  function enviarWhatsApp(divida) {
    let msg = `Olá, tudo bem? 💕%0AAqui é da Delicatta. Verificamos que o pagamento da sua compra ainda está em aberto.%0A%0A`;
    let total = 0;

    if (divida.itens && divida.itens.length > 0) {
      divida.itens.forEach(it => {
        const p = state.produtos.find(x => x.id === it.produtoId);
        if (p) {
          const subtotal = p.venda * it.qtd;
          total += subtotal;
          msg += `• ${p.nome} x${it.qtd} - ${fmt(subtotal)}%0A`;
        }
      });
    } else {
      const p = state.produtos.find(x => x.id === divida.produtoId);
      if (p) {
        total = p.venda * divida.qtd;
        msg += `• ${p.nome} x${divida.qtd} - ${fmt(total)}%0A`;
      }
    }

    msg += `%0A*Total Pendente: ${fmt(total)}*%0A%0A📍 *Dados para pagamento:*%0A• IBAN: AO06 0055 0000 1448 5973 1018 1%0A• Express: 947351010%0A%0AObrigada pela confiança ✨`;
    window.open(`https://wa.me/?text=${msg}`, '_blank');
  }

  function header(){
    let badgeClass = 'connecting';
    let badgeText = '🟡 Conectando...';

    if(syncStatus === 'protected'){
      badgeClass = 'protected';
      badgeText = '🟢 Nuvem Protegida';
    } else if(syncStatus === 'local'){
      badgeClass = '';
      badgeText = '🧪 Modo Teste Local';
    }

    return `
    <div class="header">
      <div class="brand-row">
        <div>
          <div class="brand">Delicatta<span class="dot">.</span></div>
          <div class="tagline">Gestão do meu negócio 💗</div>
        </div>
        <div class="sync-badge ${badgeClass}">${badgeText}</div>
      </div>
    </div>`;
  }

  function tabbar(){
    const tabs = [
      {id:'resumo', ic:'✨', label:'Resumo'},
      {id:'vendas', ic:'🛍️', label:'Vendas'},
      {id:'dividas', ic:'📝', label:'Dívidas'},
      {id:'estoque', ic:'📦', label:'Estoque'},
      {id:'produtos', ic:'🏷️', label:'Produtos'},
      {id:'sync', ic:'⚙️', label:'Opções'},
    ];
    return `<div class="tabbar">
      ${tabs.map(t=>`<button class="tab ${state.tab===t.id?'active':''}" data-tab="${t.id}">
        <span class="ic">${t.ic}</span>${t.label}
      </button>`).join('')}
    </div>`;
  }

  function viewResumo(){
    const vendasMes = state.vendas.filter(v => v.data && v.data.startsWith(state.selectedMonth));
    const fatMes = vendasMes.reduce((s,v) => s + totalVenda(v), 0);
    const custoMes = vendasMes.reduce((s,v) => s + totalCusto(v), 0);
    const lucroMes = vendasMes.reduce((s,v) => s + totalLucro(v), 0);
    const comissaoMes = vendasMes.reduce((s,v) => s + totalComissao(v), 0);
    const totalDividas = state.dividas.reduce((s,d) => s + totalVenda(d), 0);

    const ranking = state.produtos.map(p => {
      let qtdMes = 0;
      let valorMes = 0;
      vendasMes.forEach(v => {
        if(v.itens && Array.isArray(v.itens)){
          v.itens.forEach(it => {
            if(it.produtoId === p.id){
              qtdMes += it.qtd;
              valorMes += p.venda * it.qtd;
            }
          });
        } else if(v.produtoId === p.id){
          qtdMes += v.qtd;
          valorMes += p.venda * v.qtd;
        }
      });
      return { nome: p.nome, qtd: qtdMes, valor: valorMes };
    }).sort((a,b) => b.valor - a.valor);

    const maxValor = Math.max(1, ...ranking.map(r => r.valor));

    return `
    <div class="grid-2col">
      <div>
        <div class="section-title">
          <span>Resumo Mensal</span>

          <div class="prod-sub" style="font-size:12px;color:var(--ink);line-height:1.6;">

  }

  function viewProdutos(){

      const margem = p.venda ? (p.venda-p.custo)/p.venda : 0;

          <span class="pill">${pct(margem)}</span>

          <div class="two-col">
            <div class="field"><label>Custo Un (Kz)</label><input id="np-custo" type="number" value="${editingProd ? editingProd.custo : ''}" placeholder="16000"/></div>
            <div class="field"><label>Venda Un (Kz)</label><input id="np-venda" type="number" value="${editingProd ? editingProd.venda : ''}" placeholder="24000"/></div>

          <button class="btn" id="save-produto">${editingProd ? 'Atualizar Produto' : 'Adicionar Produto'}</button>

  function viewEstoque(){
    let totalCustoEstoque = 0;
    let totalVendaEstoque = 0;

    const rows = state.produtos.map(p=>{
      const disponivel = state.estoque[p.id]||0;
      const valorVendaSobra = Math.max(disponivel,0) * p.venda;
      const valorCustoSobra = Math.max(disponivel,0) * p.custo;
      
      totalCustoEstoque += valorCustoSobra;
      totalVendaEstoque += valorVendaSobra;

      const status = disponivel <= 2 ? 'warn' : 'ok';
      return `
      <div class="card">
        <div class="row">
          <div class="prod-name">${p.nome}</div>
          <span class="pill ${status}">${disponivel <= 2 ? 'COMPRAR' : 'DISPONÍVEL'}</span>
        </div>
        <div class="row" style="margin-top:10px;align-items:center;">
          <div class="prod-sub">Quantidade disponível:</div>
          <input class="stock-input" type="number" min="0" value="${disponivel}" data-stock-for="${p.id}"/>
        </div>
        <div class="row" style="margin-top:8px;background:var(--blush);padding:8px;border-radius:8px;">
          <div class="prod-sub">Valor de Venda Potencial: <b>${fmt(valorVendaSobra)}</b></div>
        </div>
      </div>`;
    }).join('');

    return `
    <div class="grid-2col">
      <div>
        <div class="section-title">Resumo do Estoque em Loja</div>
        <div class="card">
          <div class="prod-sub">Valor de Custo (Investido):</div>
          <div class="prod-name" style="font-size:18px;color:var(--rose-deep);">${fmt(totalCustoEstoque)}</div>
          <hr style="border:none;border-top:1px solid var(--line);margin:10px 0;"/>
          <div class="prod-sub">Valor de Venda Potencial:</div>
          <div class="prod-name" style="font-size:18px;color:var(--ok);">${fmt(totalVendaEstoque)}</div>
        </div>
      </div>
      <div>
        <div class="section-title">Controlo por Produto</div>
        ${rows || '<div class="empty">Nenhum produto ainda.</div>'}
      </div>
    </div>`;
  }

  function viewSync(){
    return `
    <div class="grid-2col">
      <div>
        <div class="section-title">Estado da Ligação</div>
        <div class="form-card">
          <p><b>Estado Atual:</b> ${syncStatus === 'protected' ? '🟢 Conectado e Protegido na Nuvem' : (syncStatus === 'connecting' ? '🟡 Conectando...' : '🧪 Modo Teste Local')}</p>
          <p style="font-size:12px;color:var(--muted);margin-top:8px;">
            ${syncStatus === 'protected' ? 'O teu banco de dados está trancado contra estranhos e sincronizado em tempo real, exclusivamente entre os vossos telemóveis e computadores.' : (syncStatus === 'connecting' ? 'A estabelecer ligação segura à nuvem...' : 'Os dados estão a ser guardados apenas localmente, neste navegador.')}
          </p>
        </div>

        <div class="section-title" style="margin-top:20px;">Cópia de Segurança (Backup)</div>
        <div class="form-card">
          <p style="font-size:13px;color:var(--muted)">Podes exportar os teus dados para o telemóvel/PC ou restaurar um ficheiro antigo:</p>
          <button class="btn" id="btn-export-backup" style="margin-bottom:10px;">💾 Baixar Ficheiro de Backup</button>
          <input type="file" id="input-import-backup" accept=".json" style="display:none;"/>
          <button class="btn secondary" id="btn-import-backup">📂 Restaurar Backup de Ficheiro</button>
        </div>
      </div>
    </div>`;
  }

  function render(){
    let body = '';
    if(state.tab==='resumo') body = viewResumo();
    else if(state.tab==='produtos') body = viewProdutos();
    else if(state.tab==='vendas') body = viewVendas();
    else if(state.tab==='dividas') body = viewDividas();
    else if(state.tab==='estoque') body = viewEstoque();
    else if(state.tab==='sync') body = viewSync();

    app.innerHTML = `${header()}<div class="content">${body}</div>${tabbar()}`;
    bindEvents();
  }

  function bindEvents(){
    $$('.tab').forEach(btn=>{
      btn.onclick = ()=>{ state.tab = btn.dataset.tab; render(); };
    });

    const monthInput = $('#resumo-month');
    if(monthInput){
      monthInput.onchange = (e)=>{
        state.selectedMonth = e.target.value;
        render();
      };
    }

    const exportBtn = $('#btn-export-backup');
    if(exportBtn){
      exportBtn.onclick = () => exportBackup();
    }

    const importBtn = $('#btn-import-backup');
    const importInput = $('#input-import-backup');
    if(importBtn && importInput){
      importBtn.onclick = () => importInput.click();
      importInput.onchange = (e) => importBackup(e);
    }

    const saveProd = $('#save-produto');
    if(saveProd){
      saveProd.onclick = ()=>{
        const nome = $('#np-nome').value.trim();
        const custo = parseFloat($('#np-custo').value)||0;
        const venda = parseFloat($('#np-venda').value)||0;
        const comissao = parseFloat($('#np-comissao').value)||0;
        if(!nome) return;

        if(state.editingProductId){
          const p = state.produtos.find(x => x.id === state.editingProductId);
          if(p){
            p.nome = nome;
            p.custo = custo;
            p.venda = venda;
            p.comissao = comissao;
          }
          state.editingProductId = null;
        } else {
          const id = uid();
          state.produtos.push({id, nome, custo, venda, comissao});
          state.estoque[id] = 0;
        }
        saveData();
      };
    }

    const cancelEditBtn = $('#cancel-edit-produto');
    if(cancelEditBtn){
      cancelEditBtn.onclick = ()=>{
        state.editingProductId = null;
        render();
      };
    }

    $$('[data-edit-prod]').forEach(btn=>{
      btn.onclick = ()=>{
        state.editingProductId = btn.dataset.editProd;
        render();
      };
    });

    $$('[data-del-prod]').forEach(btn=>{
      btn.onclick = ()=>{
        const id = btn.dataset.delProd;
        state.produtos = state.produtos.filter(p=>p.id!==id);
        state.vendas = state.vendas.filter(v=>v.id!==id);
        state.dividas = state.dividas.filter(d=>d.id!==id);
        delete state.estoque[id];
        if(state.editingProductId === id) state.editingProductId = null;
        saveData();
      };
    });

    $$('.nv-item-prod').forEach(select=>{
      select.onchange = (e)=>{
        const idx = parseInt(e.target.dataset.idx);
        formVendaItens[idx].produtoId = e.target.value;
      };
    });

    $$('.nv-item-qtd').forEach(input=>{
      input.onchange = (e)=>{
        const idx = parseInt(e.target.dataset.idx);
        formVendaItens[idx].qtd = parseInt(e.target.value) || 1;
      };
    });

    $$('.remove-venda-item-btn').forEach(btn=>{
      btn.onclick = (e)=>{
        e.preventDefault();
        const idx = parseInt(btn.dataset.idx);
        formVendaItens.splice(idx, 1);
        render();
      };
    });

    const addVendaItemBtn = $('#add-venda-item-btn');
    if(addVendaItemBtn){
      addVendaItemBtn.onclick = (e)=>{
        e.preventDefault();
        formVendaItens.push({ id: uid(), produtoId: '', qtd: 1 });
        render();
      };
    }

    const addVenda = $('#add-venda');
    if(addVenda){
      addVenda.onclick = ()=>{
        const cliente = $('#nv-cliente').value.trim();
        const data = $('#nv-data').value || today();
        const validItens = formVendaItens.filter(it => it.produtoId && it.qtd > 0);

        if(validItens.length === 0){
          alert('Por favor, selecione pelo menos um produto com quantidade válida.');
          return;
        }

        state.vendas.push({
          id: uid(),
          cliente,
          itens: validItens.map(it => ({ produtoId: it.produtoId, qtd: it.qtd })),
          data
        });

        validItens.forEach(it => {
          if(state.estoque[it.produtoId] !== undefined){
            state.estoque[it.produtoId] = Math.max(0, state.estoque[it.produtoId] - it.qtd);
          }
        });

        formVendaItens = [{ id: uid(), produtoId: '', qtd: 1 }];
        saveData();
      };
    }

    $$('.nd-item-prod').forEach(select=>{
      select.onchange = (e)=>{
        const idx = parseInt(e.target.dataset.idx);
        formDividaItens[idx].produtoId = e.target.value;
      };
    });

    $$('.nd-item-qtd').forEach(input=>{
      input.onchange = (e)=>{
        const idx = parseInt(e.target.dataset.idx);
        formDividaItens[idx].qtd = parseInt(e.target.value) || 1;
      };
    });

    $$('.remove-item-btn').forEach(btn=>{
      btn.onclick = (e)=>{
        e.preventDefault();
        const idx = parseInt(btn.dataset.idx);
        formDividaItens.splice(idx, 1);
        render();
      };
    });

    const addItemBtn = $('#add-item-btn');
    if(addItemBtn){
      addItemBtn.onclick = (e)=>{
        e.preventDefault();
        formDividaItens.push({ id: uid(), produtoId: '', qtd: 1 });
        render();
      };
    }

    const addDivida = $('#add-divida');
    if(addDivida){
      addDivida.onclick = ()=>{
        const cliente = $('#nd-cliente').value.trim();
        const data = $('#nd-data').value || today();
        const validItens = formDividaItens.filter(it => it.produtoId && it.qtd > 0);

        if(!cliente || validItens.length === 0){
          alert('Por favor, preencha o nome da cliente e selecione pelo menos um produto com quantidade válida.');
          return;
        }

        const newDivida = {
          id: uid(),
          cliente,
          itens: validItens.map(it => ({ produtoId: it.produtoId, qtd: it.qtd })),
          data
        };

        state.dividas.push(newDivida);
        formDividaItens = [{ id: uid(), produtoId: '', qtd: 1 }];
        saveData();
      };
    }

    $$('[data-pay-divida]').forEach(btn=>{
      btn.onclick = ()=>{
        const id = btn.dataset.payDivida;
        const div = state.dividas.find(d=>d.id===id);
        if(div){
          if(div.itens && Array.isArray(div.itens)){
            state.vendas.push({
              id: uid(),
              cliente: div.cliente,
              itens: div.itens,
              data: today()
            });
          } else {
            state.vendas.push({
              id: uid(),
              produtoId: div.produtoId,
              qtd: div.qtd,
              data: today()
            });
          }
          state.dividas = state.dividas.filter(d=>d.id!==id);
          saveData();
        }
      };
    });

    $$('[data-pdf-divida]').forEach(btn=>{
      btn.onclick = ()=>{
        const div = state.dividas.find(d=>d.id===btn.dataset.pdfDivida);
        if(div) gerarPDF(div, 'divida');
      };
    });

    $$('[data-pdf-venda]').forEach(btn=>{
      btn.onclick = ()=>{
        const ven = state.vendas.find(v=>v.id===btn.dataset.pdfVenda);
        if(ven) gerarPDF(ven, 'venda');
      };
    });

    $$('[data-wa-divida]').forEach(btn=>{
      btn.onclick = ()=>{
        const div = state.dividas.find(d=>d.id===btn.dataset.waDivida);
        if(div) enviarWhatsApp(div);
      };
    });

    $$('[data-del-divida]').forEach(btn=>{
      btn.onclick = ()=>{
        state.dividas = state.dividas.filter(d=>d.id!==btn.dataset.delDivida);
        saveData();
      };
    });

    $$('[data-del-venda]').forEach(btn=>{
      btn.onclick = ()=>{
        state.vendas = state.vendas.filter(v=>v.id!==btn.dataset.delVenda);
        saveData();
      };
    });

    $$('[data-stock-for]').forEach(inp=>{
      inp.onchange = ()=>{
        state.estoque[inp.dataset.stockFor] = parseInt(inp.value)||0;
        saveData();
      };
    });
  }

  init();
})();
</script>
</body>
</html>
